<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAssist AI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-layout">
        <!-- ChatGPT-style Top Navigation Header -->
        <header class="top-header">
            <div class="header-left">
                <span class="brand-name">EduAssist</span>
                <span class="badge-version">v2.0</span>
            </div>
            <div class="header-right">
                <button id="clearButton" class="new-chat-btn" type="button" title="Start New Chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New chat</span>
                </button>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-workspace">
            <div id="chatMessages" class="chat-container">
                <!-- Welcome View -->
                <div class="welcome-container" id="welcomeView">
                    <div class="welcome-icon">🎓</div>
                    <h1 class="welcome-title">What can I help with today?</h1>
                    
                    <div class="suggestion-grid">
                        <button class="suggestion-card suggestion-button" type="button">
                            <span class="card-title">Cloud Computing</span>
                            <span class="card-desc">Explain Cloud Computing vs On-Premises with examples</span>
                        </button>
                        <button class="suggestion-card suggestion-button" type="button">
                            <span class="card-title">Viva Preparation</span>
                            <span class="card-desc">Generate top IoT viva questions and answers</span>
                        </button>
                        <button class="suggestion-card suggestion-button" type="button">
                            <span class="card-title">Code Example</span>
                            <span class="card-desc">Write a Python script for binary search with explanation</span>
                        </button>
                        <button class="suggestion-card suggestion-button" type="button">
                            <span class="card-title">Study Timetable</span>
                            <span class="card-desc">Create a 7-day college exam revision study schedule</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ChatGPT-style Input Capsule & Footer -->
            <div class="input-container">
                <form id="chatForm" class="input-form">
                    <div class="input-box">
                        <textarea id="userInput" placeholder="Message EduAssist..." rows="1" maxlength="4000" required></textarea>
                        <button id="sendButton" class="send-btn" type="submit" aria-label="Send message" disabled>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                <polyline points="5 12 12 5 19 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>

                <footer class="app-footer">
                    <span>Roshan Kumar Patra | Reg: 230301120480</span>
                </footer>
            </div>
        </main>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
